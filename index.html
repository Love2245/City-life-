<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#10131f">
    <style>html,body{margin:0;background-color:#10131f}</style>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a2440'/%3E%3Cpath d='M6 26V14h6v12M14 26V6h7v20M23 26V11h4v15' fill='%23ffd166'/%3E%3C/svg%3E">
    <title>都市生活</title>
  </head>
  <body>
    <section id="local-file-help" hidden>
      <h1>从启动入口打开都市生活</h1>
      <p>请回到这个文件夹，双击 <strong>启动游戏.cmd</strong>。</p>
      <p>这是源码目录，index.html 需要本地服务器才能运行。启动入口会自动打开游戏窗口，无需手动打开本文件。</p>
      <p>若游戏窗口没有出现，请先双击启动入口，再打开下面的地址：</p>
      <a href="http://127.0.0.1:1420/">http://127.0.0.1:1420/</a>
    </section>
    <style>
      #local-file-help { max-width: 560px; margin: 14vh auto; padding: 32px; border: 1px solid #425171; border-radius: 18px; background: #1a2440; color: #edf2ff; font: 16px/1.8 system-ui, sans-serif; }
      #local-file-help[hidden] { display: none; }
      #local-file-help h1 { margin: 0 0 16px; font-size: 24px; }
      #local-file-help a { color: #ffd166; }
    </style>
    <script>
      var isFile = location.protocol === 'file:';
      if (isFile) {
        document.body.style.background = '#10182a';
        document.getElementById('local-file-help').hidden = false;
      }
      (function () {
        // Report readiness from inline script: it runs before any module, Tauri API or
        // IPC is involved, so the launcher window closes as soon as the page is live
        // instead of waiting on a report that a failing module could swallow.
        fetch('/__urban_life_desktop').then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
          if (data && data.projectId) {
            return fetch('/__urban_life_desktop/ready', { method: 'POST', headers: { 'x-urban-life-launcher': data.projectId } });
          }
        }).catch(function () {});
        // This script is parsed before #app/#boot-hint exist, so the hint work must
        // wait for DOMContentLoaded. On file:// the module never loads (module scripts
        // are blocked on the file protocol) and the hint would otherwise cover the
        // help text forever. Over http the observer is only a fallback: main.ts also
        // removes the hint the moment Svelte mounts.
        document.addEventListener('DOMContentLoaded', function () {
          var app = document.getElementById('app'), hint = document.getElementById('boot-hint');
          if (!app || !hint) return;
          if (isFile) { hint.remove(); return; }
          var observer = new MutationObserver(function () {
            if (app.children.length > 1) { hint.remove(); observer.disconnect(); }
          });
          observer.observe(app, { childList: true });
        });
      })();
    </script>
    <div id="app"><div id="boot-hint"><strong data-boot-brand>都市生活</strong><span>正在加载游戏，首次可能需要几分钟…</span><span data-boot-progress role="progressbar" aria-label="加载中"></span></div></div>
    <style>
      #boot-hint { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;
        background: #10182a; color: #edf2ff; font: 16px/1.8 system-ui, sans-serif; }
      #boot-hint [data-boot-brand] { font-size: 24px; letter-spacing: .12em; }
      #boot-hint [data-boot-progress] { display: block; width: min(220px, 65vw); height: 5px; overflow: hidden; border-radius: 5px; background: #44516a; }
      #boot-hint [data-boot-progress]::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: #ffd166; animation: boot-progress 1.4s ease-in-out infinite alternate; }
      @keyframes boot-progress { from { transform: translateX(0); } to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { #boot-hint [data-boot-progress]::after { animation: none; } }
    </style>
    <template id="portable-assets-anchor"></template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
